name: AME84 Lean Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ame84-lean
    steps:
      - uses: actions/checkout@v4
      - name: Decode project source
        working-directory: .
        shell: bash
        run: |
          rm -rf ame84-lean
          mkdir -p ame84-lean
          base64 -d ame84_project.tar.gz.b64 | tar -xz -C ame84-lean
      - name: Install Elan and pinned Lean toolchain
        working-directory: .
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify pinned Lean toolchain
        shell: bash
        run: |
          elan toolchain install leanprover/lean4:v4.32.1
          elan override set leanprover/lean4:v4.32.1
          lean --version
          lake --version
      - name: Restore exact Mathlib dependency cache
        uses: actions/cache@v4
        with:
          path: ame84-lean/.lake/packages
          key: ame84-mathlib-520045ab14e26149ee970e2e617ca04b09bde5d6-v1
      - name: Resolve exact dependencies
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Record exact environment
        shell: bash
        run: |
          mkdir -p build_logs
          {
            lean --version
            lake --version
            printf 'mathlib pin: '
            grep '^rev' lakefile.toml
            printf 'mathlib resolved revision: '
            python3 - <<'PY'
          import json
          with open('lake-manifest.json', encoding='utf-8') as f:
              data = json.load(f)
          for pkg in data.get('packages', []):
              if pkg.get('name') == 'mathlib':
                  print(pkg.get('rev'))
                  break
          PY
          } | tee build_logs/environment.log
      - name: Clean Lake build
        shell: bash
        run: |
          set -o pipefail
          rm -rf .lake/build
          lake build 2>&1 | tee build_logs/clean_lake_build.log
      - name: Print theorem axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean AME84Support512/AxiomReport.lean 2>&1 | tee build_logs/axiom_report_output.log
      - name: Reject placeholders
        if: always()
        run: python3 scripts/check_no_placeholders.py
      - name: Generate source manifest
        if: always()
        shell: bash
        run: |
          find . -path './.lake' -prune -o -path './MANIFEST.sha256' -prune -o -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > MANIFEST.sha256
      - name: Upload compiler-clean source and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ame84-lean-project
          path: |
            ame84-lean
            !ame84-lean/.lake
          include-hidden-files: true
          retention-days: 30
