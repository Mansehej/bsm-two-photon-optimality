name: AME84 tiered certified build v6

on:
  push:
    branches: [ame84-support512-lean-build]
    paths:
      - '.github/workflows/ame84-lean-tiered-v6.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract tier 0 source from audited v5 template
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ame84-lean
          mkdir -p ame84-lean/AME84Support512 ame84-lean/build_logs ame84-lean/scripts
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('.github/workflows/ame84-lean-tiered-v5.yml').read_text().splitlines()
          def marker(text):
              return next(i for i, line in enumerate(src) if text in line)
          def extract(lo, hi):
              i = lo
              while i < hi:
                  line = src[i]
                  m = re.match(r"^(\s*)cat > ([^ ]+) <<'?EOF'?\s*$", line)
                  if not m:
                      i += 1
                      continue
                  indent, raw_path = len(m.group(1)), m.group(2)
                  body = []
                  i += 1
                  while i < hi and src[i].strip() != 'EOF':
                      s = src[i]
                      body.append(s[indent:] if s.startswith(' ' * indent) else s)
                      i += 1
                  path = Path(raw_path)
                  if path.parts[0] != 'ame84-lean':
                      path = Path('ame84-lean') / path
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text('\n'.join(body) + '\n')
                  i += 1
          extract(marker('Materialize tier 0 baseline'), marker('uses: leanprover/lean-action'))
          PY
          cat > ame84-lean/scripts/check_no_placeholders.py <<'PY'
          from pathlib import Path
          import re, sys
          patterns=[r'\bsorry\b',r'\badmit\b',r'\bunsafe\b',r'^\s*axiom\b',r'^\s*opaque\b']
          bad=[]
          for p in Path('.').rglob('*.lean'):
              if '.lake' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8')
              for pat in patterns:
                  if re.search(pat,s,re.MULTILINE): bad.append((str(p),pat))
          if bad:
              print(*bad,sep='\n'); sys.exit(1)
          print('placeholder scan: clean')
          PY
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ame84-lean
          use-github-cache: true
      - name: Fetch exact Mathlib cache and snapshot clean tier 0
        shell: bash
        run: |
          set -euo pipefail
          cd ame84-lean
          lake exe cache get
          rm -rf .lake/build
          lake build 2>&1 | tee build_logs/tier0_build.log
          cd ..
          rm -rf /tmp/ame84-tier0
          cp -a ame84-lean /tmp/ame84-tier0
          echo 0 > /tmp/ame84-selected-tier
      - name: Extract and attempt tier 1
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('.github/workflows/ame84-lean-tiered-v5.yml').read_text().splitlines()
          lo=next(i for i,l in enumerate(src) if 'Attempt tier 1 moment and support core' in l)
          hi=next(i for i,l in enumerate(src) if 'Attempt tier 2 orthogonality' in l)
          i=lo
          while i<hi:
              m=re.match(r"^(\s*)cat > ([^ ]+) <<'?EOF'?\s*$",src[i])
              if not m:
                  i+=1; continue
              indent,raw=len(m.group(1)),m.group(2); body=[]; i+=1
              while i<hi and src[i].strip()!='EOF':
                  s=src[i]; body.append(s[indent:] if s.startswith(' '*indent) else s); i+=1
              path=Path(raw)
              if path.parts[0]!='ame84-lean': path=Path('ame84-lean')/path
              path.parent.mkdir(parents=True,exist_ok=True); path.write_text('\n'.join(body)+'\n'); i+=1
          PY
          cd ame84-lean
          rm -rf .lake/build
          if lake build > build_logs/tier1_build.log 2>&1; then
            echo 1 > /tmp/ame84-selected-tier
            rm -rf /tmp/ame84-tier1
            cp -a . /tmp/ame84-tier1
          else
            cp build_logs/tier1_build.log /tmp/tier1_failed_build.log
            cd ..
            rm -rf ame84-lean
            cp -a /tmp/ame84-tier0 ame84-lean
          fi
      - name: Extract and attempt tier 2
        shell: bash
        run: |
          set -uo pipefail
          if [ "$(cat /tmp/ame84-selected-tier)" != "1" ]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('.github/workflows/ame84-lean-tiered-v5.yml').read_text().splitlines()
          lo=next(i for i,l in enumerate(src) if 'Attempt tier 2 orthogonality' in l)
          hi=next(i for i,l in enumerate(src) if 'Finalize selected tier documentation' in l)
          i=lo
          while i<hi:
              m=re.match(r"^(\s*)cat > ([^ ]+) <<'?EOF'?\s*$",src[i])
              if not m:
                  i+=1; continue
              indent,raw=len(m.group(1)),m.group(2); body=[]; i+=1
              while i<hi and src[i].strip()!='EOF':
                  s=src[i]; body.append(s[indent:] if s.startswith(' '*indent) else s); i+=1
              path=Path(raw)
              if path.parts[0]!='ame84-lean': path=Path('ame84-lean')/path
              path.parent.mkdir(parents=True,exist_ok=True); path.write_text('\n'.join(body)+'\n'); i+=1
          PY
          cd ame84-lean
          rm -rf .lake/build
          if lake build > build_logs/tier2_build.log 2>&1; then
            echo 2 > /tmp/ame84-selected-tier
          else
            cp build_logs/tier2_build.log /tmp/tier2_failed_build.log
            cd ..
            rm -rf ame84-lean
            cp -a /tmp/ame84-tier1 ame84-lean
          fi
      - name: Final clean build, theorem boundary, and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          tier=$(cat /tmp/ame84-selected-tier)
          cd ame84-lean
          cp /tmp/tier1_failed_build.log build_logs/ 2>/dev/null || true
          cp /tmp/tier2_failed_build.log build_logs/ 2>/dev/null || true
          cat > README.md <<EOF
          # AME(8,4) support-512 Lean package

          Selected compiler-clean tier: **${tier}**.

          - Lean: \`leanprover/lean4:v4.32.1\`
          - Mathlib: \`520045ab14e26149ee970e2e617ca04b09bde5d6\`

          This package makes no claim that unrestricted AME(8,4) exists or does not exist. The exact formalization boundary is in \`FORMALIZATION_MANIFEST.md\`.
          EOF
          if [ "$tier" = 2 ]; then
            cat > FORMALIZATION_MANIFEST.md <<'EOF'
          # Formalization manifest — tier 2

          ## Kernel-proved, assumption-free
          - exact polynomial table, falling-factorial expansion, and `7/2560` arithmetic;
          - fourth-moment atom certificate from explicit moment hypotheses;
          - abstract 256-fiber support bound 512 and equality saturation;
          - exclusion of exactly one common nonzero from complex row orthogonality;
          - local `K_2,2` structure from degree-two row and column supports;
          - finite cut/block counts, Singleton parameter arithmetic, and negative controls.

          ## Conditional classification corollary
          `conditional_additive_code_exclusion` accepts `KurzNThreePointFiveSThreeEqSeven` as a named hypothesis. No axiom is declared.

          ## Unformalized
          The concrete AME marginal-to-moment derivation, global decomposition into exactly 128 disjoint blocks, 2x2 unitary parametrization, all-35-cut sufficiency, and binary-affine-to-code construction are not Lean theorems in this archive.
          EOF
          elif [ "$tier" = 1 ]; then
            cat > FORMALIZATION_MANIFEST.md <<'EOF'
          # Formalization manifest — tier 1

          ## Kernel-proved
          Exact polynomial/moment atom certificate; abstract 256-fiber support bound 512; equality saturation; finite arithmetic; negative controls; conditional classification interface.

          ## Unformalized
          Concrete AME marginal bridge, graph/block normal form, all-35-cut theorem, 2x2 unitary theorem, and binary-affine reduction.
          EOF
          else
            cat > FORMALIZATION_MANIFEST.md <<'EOF'
          # Formalization manifest — tier 0

          ## Kernel-proved
          Exact polynomial and finite-count arithmetic, Singleton distance arithmetic, negative arithmetic controls, and the conditional classification interface.

          ## Unformalized
          The probability-moment bridge, atom theorem for arbitrary distributions, support bound, equality OA theorem, graph/block normal form, and binary-affine reduction.
          EOF
          fi
          cat > THEOREM_MAP.md <<EOF
          # Theorem map

          Selected tier: ${tier}.

          Baseline exports: \`certificatePolynomial_table\`, \`certificate_expectation_arithmetic\`, \`finite_counts\`, \`singleton_forces_distance_five\`, and \`conditional_additive_code_exclusion\`.

          Tier 1 additionally exports the exact moment certificate, atom bound, support-512 counting theorem, equality saturation, and mutations. Tier 2 additionally exports the orthogonality and local \`K_2,2\` theorems.
          EOF
          cat > AXIOM_REPORT.md <<'EOF'
          # Axiom report

          No project axiom is declared. The Kurz statement is a proposition passed explicitly as a hypothesis. The exact `#print axioms` transcript is in `build_logs/axiom_report_output.log`.
          EOF
          cat > AME84Support512/AxiomReport.lean <<'EOF'
          import AME84Support512
          open AME84Support512
          #print axioms certificatePolynomial_table
          #print axioms certificate_expectation_arithmetic
          #print axioms finite_counts
          #print axioms singleton_forces_distance_five
          #print axioms conditional_additive_code_exclusion
          EOF
          if [ "$tier" -ge 1 ]; then cat >> AME84Support512/AxiomReport.lean <<'EOF'
          #print axioms P_falling_factorial_expansion
          #print axioms expected_P_eq_seven_over_2560
          #print axioms atom_eight_le_seven_over_2560
          #print axioms support_at_least_512
          #print axioms support_512_forces_index_two
          #print axioms third_order_does_not_force_atom_bound
          EOF
          fi
          if [ "$tier" -ge 2 ]; then cat >> AME84Support512/AxiomReport.lean <<'EOF'
          #print axioms orthogonal_rows_have_no_single_common_support
          #print axioms degree_two_orthogonal_support_is_locally_K22
          EOF
          fi
          rm -rf .lake/build
          lake build 2>&1 | tee build_logs/clean_lake_build.log
          {
            echo
            echo '--- environment attestation ---'
            lean --version
            lake --version
            printf 'mathlib_commit='
            git -C .lake/packages/mathlib rev-parse HEAD
            echo "selected_tier=${tier}"
            echo 'lake_build_exit_status=0'
          } | tee -a build_logs/clean_lake_build.log
          lake env lean AME84Support512/AxiomReport.lean 2>&1 | tee build_logs/axiom_report_output.log
          python3 scripts/check_no_placeholders.py
      - name: Package and upload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ame84-final
          mkdir -p ame84-final
          find ame84-lean -type f -not -path 'ame84-lean/.lake/*' -print0 | sort -z | xargs -0 sha256sum > ame84-lean/MANIFEST.sha256
          (cd ame84-lean && zip -qr ../ame84-final/AME84_support512_Lean_FINAL_v6.zip . -x '.lake/*')
          sha256sum ame84-final/AME84_support512_Lean_FINAL_v6.zip > ame84-final/AME84_support512_Lean_FINAL_v6.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AME84-support512-Lean-FINAL-v6
          path: ame84-final
          retention-days: 30
      - name: Commit archive to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AME84 Lean CI'
          git config user.email 'actions@users.noreply.github.com'
          mkdir -p ame84-deliverables
          cp ame84-final/AME84_support512_Lean_FINAL_v6.zip ame84-deliverables/
          cp ame84-final/AME84_support512_Lean_FINAL_v6.zip.sha256 ame84-deliverables/
          git add -f ame84-deliverables/AME84_support512_Lean_FINAL_v6.zip ame84-deliverables/AME84_support512_Lean_FINAL_v6.zip.sha256
          git commit -m 'Attach tier-selected compiler-clean AME84 Lean package v6' || exit 0
          git push origin HEAD:ame84-support512-lean-build
