name: Publish AME84 Lean downloadable archive v10

on:
  push:
    branches: [ame84-support512-lean-build]
    paths:
      - '.github/workflows/ame84-lean-release-v10.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ame84-support512-lean-build
      - name: Obtain compiler-clean v8 archive
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 120); do
            git fetch origin ame84-support512-lean-build
            if git show origin/ame84-support512-lean-build:ame84-deliverables/AME84_support512_Lean_FINAL_v8.zip > AME84_support512_Lean_FINAL.zip 2>/dev/null && \
               git show origin/ame84-support512-lean-build:ame84-deliverables/AME84_support512_Lean_FINAL_v8.zip.sha256 > upstream.sha256 2>/dev/null; then
              found=1
              break
            fi
            sleep 10
          done
          test "$found" = 1
          unzip -t AME84_support512_Lean_FINAL.zip
          sha256sum AME84_support512_Lean_FINAL.zip > AME84_support512_Lean_FINAL.zip.sha256
      - name: Publish fixed-tag release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=ame84-support512-lean-audited-2026-08-25
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            AME84_support512_Lean_FINAL.zip \
            AME84_support512_Lean_FINAL.zip.sha256 \
            --title 'Audited AME(8,4) support-512 Lean package' \
            --notes 'CI-created only after the selected Lean 4.32.1 + pinned Mathlib project completed a clean lake build, axiom-report run, forbidden-placeholder scan, manifest generation, and ZIP integrity check. See the archive manifest for the exact formalization boundary. This release does not claim unrestricted AME(8,4) existence or nonexistence.'
