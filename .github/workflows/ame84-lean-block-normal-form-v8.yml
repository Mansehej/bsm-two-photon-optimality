name: AME84 block normal form v8

on:
  push:
    branches: [ame84-support512-lean-build]
    paths:
      - '.github/workflows/ame84-lean-block-normal-form-v8.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ame84-support512-lean-build
      - name: Obtain v7 compiler-clean base
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 90); do
            git fetch origin ame84-support512-lean-build
            if git show origin/ame84-support512-lean-build:ame84-deliverables/AME84_support512_Lean_FINAL_v7.zip > /tmp/ame84-v7.zip 2>/dev/null; then
              found=1
              break
            fi
            sleep 10
          done
          test "$found" = 1
          rm -rf ame84-lean
          mkdir ame84-lean
          unzip -q /tmp/ame84-v7.zip -d ame84-lean
          cp -a ame84-lean /tmp/ame84-base-v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ame84-lean
          use-github-cache: true
      - name: Attempt exact 2x2 matrix/Gram equivalence and cut count
        shell: bash
        run: |
          set -uo pipefail
          cd ame84-lean
          cat > AME84Support512/BlockNormalForm.lean <<'EOF'
          import Mathlib

          open scoped BigOperators ComplexConjugate

          namespace AME84Support512

          structure Block2 where
            a : ℂ
            b : ℂ
            c : ℂ
            d : ℂ

          def Block2.toMatrix (B : Block2) : Matrix (Fin 2) (Fin 2) ℂ :=
            fun i j => if i = 0 then (if j = 0 then B.a else B.b)
              else (if j = 0 then B.c else B.d)

          def Block2.scaledMatrix (B : Block2) : Matrix (Fin 2) (Fin 2) ℂ :=
            (16 : ℂ) • B.toMatrix

          def Block2.IsScaledUnitary (B : Block2) : Prop :=
            B.scaledMatrix * B.scaledMatrix.conjTranspose = 1

          def Block2.ScaledGramEquations (B : Block2) : Prop :=
            ((16 : ℂ) * B.a) * star ((16 : ℂ) * B.a) +
                ((16 : ℂ) * B.b) * star ((16 : ℂ) * B.b) = 1 ∧
            ((16 : ℂ) * B.a) * star ((16 : ℂ) * B.c) +
                ((16 : ℂ) * B.b) * star ((16 : ℂ) * B.d) = 0 ∧
            ((16 : ℂ) * B.c) * star ((16 : ℂ) * B.a) +
                ((16 : ℂ) * B.d) * star ((16 : ℂ) * B.b) = 0 ∧
            ((16 : ℂ) * B.c) * star ((16 : ℂ) * B.c) +
                ((16 : ℂ) * B.d) * star ((16 : ℂ) * B.d) = 1

          def Block2.NormalizedGramEquations (B : Block2) : Prop :=
            B.a * star B.a + B.b * star B.b = (1 : ℂ) / 256 ∧
            B.a * star B.c + B.b * star B.d = 0 ∧
            B.c * star B.a + B.d * star B.b = 0 ∧
            B.c * star B.c + B.d * star B.d = (1 : ℂ) / 256

          theorem scaled_unitary_iff_scaled_gram (B : Block2) :
              B.IsScaledUnitary ↔ B.ScaledGramEquations := by
            constructor
            · intro h
              have h00 := congrFun (congrFun h (0 : Fin 2)) (0 : Fin 2)
              have h01 := congrFun (congrFun h (0 : Fin 2)) (1 : Fin 2)
              have h10 := congrFun (congrFun h (1 : Fin 2)) (0 : Fin 2)
              have h11 := congrFun (congrFun h (1 : Fin 2)) (1 : Fin 2)
              constructor
              · simpa [Block2.IsScaledUnitary, Block2.scaledMatrix, Block2.toMatrix,
                    Matrix.mul_apply, Matrix.conjTranspose_apply, Fin.sum_univ_succ] using h00
              constructor
              · simpa [Block2.IsScaledUnitary, Block2.scaledMatrix, Block2.toMatrix,
                    Matrix.mul_apply, Matrix.conjTranspose_apply, Fin.sum_univ_succ] using h01
              constructor
              · simpa [Block2.IsScaledUnitary, Block2.scaledMatrix, Block2.toMatrix,
                    Matrix.mul_apply, Matrix.conjTranspose_apply, Fin.sum_univ_succ] using h10
              · simpa [Block2.IsScaledUnitary, Block2.scaledMatrix, Block2.toMatrix,
                    Matrix.mul_apply, Matrix.conjTranspose_apply, Fin.sum_univ_succ] using h11
            · intro h
              ext i j
              fin_cases i <;> fin_cases j
              · simpa [Block2.IsScaledUnitary, Block2.scaledMatrix, Block2.toMatrix,
                    Matrix.mul_apply, Matrix.conjTranspose_apply, Fin.sum_univ_succ] using h.1
              · simpa [Block2.IsScaledUnitary, Block2.scaledMatrix, Block2.toMatrix,
                    Matrix.mul_apply, Matrix.conjTranspose_apply, Fin.sum_univ_succ] using h.2.1
              · simpa [Block2.IsScaledUnitary, Block2.scaledMatrix, Block2.toMatrix,
                    Matrix.mul_apply, Matrix.conjTranspose_apply, Fin.sum_univ_succ] using h.2.2.1
              · simpa [Block2.IsScaledUnitary, Block2.scaledMatrix, Block2.toMatrix,
                    Matrix.mul_apply, Matrix.conjTranspose_apply, Fin.sum_univ_succ] using h.2.2.2

          theorem scaled_gram_iff_normalized_gram (B : Block2) :
              B.ScaledGramEquations ↔ B.NormalizedGramEquations := by
            constructor
            · rintro ⟨h00, h01, h10, h11⟩
              constructor
              · linear_combination (1 / 256 : ℂ) * h00
              constructor
              · linear_combination (1 / 256 : ℂ) * h01
              constructor
              · linear_combination (1 / 256 : ℂ) * h10
              · linear_combination (1 / 256 : ℂ) * h11
            · rintro ⟨h00, h01, h10, h11⟩
              constructor
              · linear_combination (256 : ℂ) * h00
              constructor
              · linear_combination (256 : ℂ) * h01
              constructor
              · linear_combination (256 : ℂ) * h10
              · linear_combination (256 : ℂ) * h11

          theorem scaled_unitary_iff_normalized_gram (B : Block2) :
              B.IsScaledUnitary ↔ B.NormalizedGramEquations := by
            rw [scaled_unitary_iff_scaled_gram, scaled_gram_iff_normalized_gram]

          abbrev CutSite := Fin 8
          def BalancedCutRepresentative :=
            {J : Finset CutSite // J.card = 4 ∧ (0 : CutSite) ∈ J}

          theorem balanced_cut_representative_count :
              Fintype.card BalancedCutRepresentative = 35 := by
            native_decide

          def attainingBlock : Block2 where
            a := 3 / 80
            b := 1 / 20
            c := -(1 / 20)
            d := 3 / 80

          theorem attainingBlock_scaled_unitary : attainingBlock.IsScaledUnitary := by
            rw [scaled_unitary_iff_normalized_gram]
            norm_num [attainingBlock, Block2.NormalizedGramEquations]

          def wrongSignBlock : Block2 where
            a := 3 / 80
            b := 1 / 20
            c := 1 / 20
            d := 3 / 80

          theorem wrong_sign_block_is_not_unitary : ¬ wrongSignBlock.IsScaledUnitary := by
            rw [scaled_unitary_iff_normalized_gram]
            norm_num [wrongSignBlock, Block2.NormalizedGramEquations]

          end AME84Support512
          EOF
          printf '\nimport AME84Support512.BlockNormalForm\n' >> AME84Support512.lean
          rm -rf .lake/build
          if lake build > build_logs/block_normal_form_attempt.log 2>&1; then
            echo success > /tmp/block-status
          else
            echo failed > /tmp/block-status
            cp build_logs/block_normal_form_attempt.log /tmp/block_failed.log
            cd ..
            rm -rf ame84-lean
            cp -a /tmp/ame84-base-v7 ame84-lean
          fi
      - name: Final clean build and package
        shell: bash
        run: |
          set -euo pipefail
          status=$(cat /tmp/block-status)
          cd ame84-lean
          cp /tmp/block_failed.log build_logs/ 2>/dev/null || true
          if [ "$status" = success ]; then
            cat >> FORMALIZATION_MANIFEST.md <<'EOF'

          ## 2x2 block layer added by v8
          - actual `Matrix (Fin 2) (Fin 2) ℂ` formulation;
          - necessity and sufficiency of the four normalized row-Gram equations for `16 B` to be unitary in the row-Gram sense;
          - exact attaining block and wrong-sign mutation;
          - exact count of 35 complementary-cut representatives containing party zero.
          EOF
            cat >> THEOREM_MAP.md <<'EOF'

          v8 exports: `scaled_unitary_iff_scaled_gram`, `scaled_gram_iff_normalized_gram`, `scaled_unitary_iff_normalized_gram`, `balanced_cut_representative_count`, `attainingBlock_scaled_unitary`, `wrong_sign_block_is_not_unitary`.
          EOF
          fi
          cat > AME84Support512/AxiomReport.lean <<'EOF'
          import AME84Support512
          open AME84Support512
          #print axioms certificatePolynomial_table
          #print axioms certificate_expectation_arithmetic
          #print axioms finite_counts
          #print axioms singleton_forces_distance_five
          #print axioms conditional_additive_code_exclusion
          EOF
          if grep -q 'MomentCertificate' AME84Support512.lean; then cat >> AME84Support512/AxiomReport.lean <<'EOF'
          #print axioms P_falling_factorial_expansion
          #print axioms expected_P_eq_seven_over_2560
          #print axioms atom_eight_le_seven_over_2560
          #print axioms support_at_least_512
          #print axioms support_512_forces_index_two
          EOF
          fi
          if grep -q 'GraphCore' AME84Support512.lean; then cat >> AME84Support512/AxiomReport.lean <<'EOF'
          #print axioms orthogonal_rows_have_no_single_common_support
          #print axioms degree_two_orthogonal_support_is_locally_K22
          EOF
          fi
          if grep -q 'ConcreteOutcome' AME84Support512.lean; then cat >> AME84Support512/AxiomReport.lean <<'EOF'
          #print axioms concrete_falling_moment
          #print axioms concrete_expected_P_eq
          #print axioms concrete_atom_bound
          #print axioms concrete_support_at_least_512
          #print axioms concrete_support_512_forces_OA_index_two
          EOF
          fi
          if [ "$status" = success ]; then cat >> AME84Support512/AxiomReport.lean <<'EOF'
          #print axioms scaled_unitary_iff_normalized_gram
          #print axioms balanced_cut_representative_count
          #print axioms attainingBlock_scaled_unitary
          #print axioms wrong_sign_block_is_not_unitary
          EOF
          fi
          rm -rf .lake/build
          lake build 2>&1 | tee build_logs/clean_lake_build.log
          {
            echo
            echo '--- environment attestation ---'
            lean --version
            lake --version
            printf 'mathlib_commit='
            git -C .lake/packages/mathlib rev-parse HEAD
            echo "block_normal_form=${status}"
            echo 'lake_build_exit_status=0'
          } | tee -a build_logs/clean_lake_build.log
          lake env lean AME84Support512/AxiomReport.lean 2>&1 | tee build_logs/axiom_report_output.log
          python3 scripts/check_no_placeholders.py
          cd ..
          rm -rf ame84-final-v8
          mkdir ame84-final-v8
          find ame84-lean -type f -not -path 'ame84-lean/.lake/*' -print0 | sort -z | xargs -0 sha256sum > ame84-lean/MANIFEST.sha256
          (cd ame84-lean && zip -qr ../ame84-final-v8/AME84_support512_Lean_FINAL_v8.zip . -x '.lake/*')
          sha256sum ame84-final-v8/AME84_support512_Lean_FINAL_v8.zip > ame84-final-v8/AME84_support512_Lean_FINAL_v8.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AME84-support512-Lean-FINAL-v8
          path: ame84-final-v8
          retention-days: 30
      - name: Commit v8 archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AME84 Lean CI'
          git config user.email 'actions@users.noreply.github.com'
          mkdir -p ame84-deliverables
          cp ame84-final-v8/AME84_support512_Lean_FINAL_v8.zip ame84-deliverables/
          cp ame84-final-v8/AME84_support512_Lean_FINAL_v8.zip.sha256 ame84-deliverables/
          git add -f ame84-deliverables/AME84_support512_Lean_FINAL_v8.zip ame84-deliverables/AME84_support512_Lean_FINAL_v8.zip.sha256
          git commit -m 'Attach AME84 Lean package with block normal-form attempt v8' || exit 0
          git push origin HEAD:ame84-support512-lean-build
