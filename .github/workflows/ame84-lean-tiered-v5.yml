name: AME84 tiered certified build v5

on:
  push:
    branches: [ame84-support512-lean-build]
    paths:
      - '.github/workflows/ame84-lean-tiered-v5.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize tier 0 baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ame84-lean
          mkdir -p ame84-lean/AME84Support512 ame84-lean/build_logs ame84-lean/scripts
          cat > ame84-lean/lean-toolchain <<'EOF'
          leanprover/lean4:v4.32.1
          EOF
          cat > ame84-lean/lakefile.toml <<'EOF'
          name = "ame84_support512"
          version = "0.1.0"
          defaultTargets = ["AME84Support512"]

          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "520045ab14e26149ee970e2e617ca04b09bde5d6"

          [[lean_lib]]
          name = "AME84Support512"
          EOF
          cat > ame84-lean/AME84Support512.lean <<'EOF'
          import AME84Support512.Baseline
          EOF
          cat > ame84-lean/AME84Support512/Baseline.lean <<'EOF'
          import Mathlib

          namespace AME84Support512

          def certificatePolynomial (t : ℕ) : ℚ :=
            (t : ℚ) * ((t : ℚ) - 1) * ((t : ℚ) - 3) * ((t : ℚ) - 4) / 1120

          theorem certificatePolynomial_table :
              certificatePolynomial 0 = 0 ∧ certificatePolynomial 1 = 0 ∧
              certificatePolynomial 2 = 1 / 280 ∧ certificatePolynomial 3 = 0 ∧
              certificatePolynomial 4 = 0 ∧ certificatePolynomial 5 = 1 / 28 ∧
              certificatePolynomial 6 = 9 / 56 ∧ certificatePolynomial 7 = 9 / 20 ∧
              certificatePolynomial 8 = 1 := by
            norm_num [certificatePolynomial]

          theorem certificate_expectation_arithmetic :
              (1 / 280 : ℚ) * (7 / 4)
                - (3 / 280 : ℚ) * (7 / 8)
                + (3 / 140 : ℚ) * (35 / 128) = 7 / 2560 := by
            norm_num

          theorem finite_counts :
              Nat.choose 8 4 = 70 ∧ 70 / 2 = 35 ∧ 256 * 2 = 512 ∧ 512 / 4 = 128 := by
            norm_num [Nat.choose]

          abbrev QuquartAdditiveSymbol := ZMod 2 × ZMod 2
          abbrev QuquartWord8 := Fin 8 → QuquartAdditiveSymbol

          structure AdditiveQuaternaryCode8 where
            carrier : AddSubgroup QuquartWord8

          def blockWeight (x : QuquartWord8) : ℕ :=
            (Finset.univ.filter fun i => x i ≠ 0).card

          def DistanceAtLeast (C : AdditiveQuaternaryCode8) (d : ℕ) : Prop :=
            ∀ x : C.carrier, x.1 ≠ 0 → d ≤ blockWeight x.1

          def HasTargetAdditiveParameters (C : AdditiveQuaternaryCode8) : Prop :=
            Fintype.card C.carrier = 128 ∧ DistanceAtLeast C 5

          def KurzNThreePointFiveSThreeEqSeven : Prop :=
            ∀ C : AdditiveQuaternaryCode8, HasTargetAdditiveParameters C → False

          theorem conditional_additive_code_exclusion
              (hKurz : KurzNThreePointFiveSThreeEqSeven) :
              ¬ ∃ C : AdditiveQuaternaryCode8, HasTargetAdditiveParameters C := by
            rintro ⟨C, hC⟩
            exact hKurz C hC

          theorem singleton_forces_distance_five
              (d : ℕ) (hge : 5 ≤ d) (hle : d ≤ 8)
              (hSingleton : 128 ≤ 4 ^ (8 - d + 1)) : d = 5 := by
            interval_cases d <;> norm_num at hge hle hSingleton ⊢

          theorem moment_order_mutation_arithmetic : (3 / 320 : ℚ) > 7 / 2560 := by
            norm_num

          theorem fiber_atom_mutation_arithmetic : ¬ ((1 / 256 : ℚ) ≤ 7 / 2560) := by
            norm_num

          end AME84Support512
          EOF
          cat > ame84-lean/AME84Support512/AxiomReport.lean <<'EOF'
          import AME84Support512
          open AME84Support512
          #print axioms certificatePolynomial_table
          #print axioms certificate_expectation_arithmetic
          #print axioms finite_counts
          #print axioms singleton_forces_distance_five
          #print axioms conditional_additive_code_exclusion
          EOF
          cat > ame84-lean/scripts/check_no_placeholders.py <<'EOF'
          from pathlib import Path
          import re, sys
          patterns = [r'\bsorry\b', r'\badmit\b', r'\bunsafe\b', r'^\s*axiom\b', r'^\s*opaque\b']
          bad=[]
          for p in Path('.').rglob('*.lean'):
              s=p.read_text(encoding='utf-8')
              for pat in patterns:
                  if re.search(pat,s,re.MULTILINE): bad.append((str(p),pat))
          if bad:
              print(*bad,sep='\n'); sys.exit(1)
          print('placeholder scan: clean')
          EOF
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ame84-lean
          use-github-cache: true
      - name: Fetch exact Mathlib cache
        working-directory: ame84-lean
        run: lake exe cache get
      - name: Verify baseline and snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd ame84-lean
          rm -rf .lake/build
          lake build 2>&1 | tee build_logs/tier0_build.log
          cd ..
          rm -rf /tmp/ame84-tier0
          cp -a ame84-lean /tmp/ame84-tier0
          echo 0 > /tmp/ame84-selected-tier
      - name: Attempt tier 1 moment and support core
        shell: bash
        run: |
          set -uo pipefail
          cd ame84-lean
          cat > AME84Support512/MomentCertificate.lean <<'EOF'
          import Mathlib
          open scoped BigOperators
          namespace AME84Support512
          abbrev AgreementCount := Fin 9
          def P (t : ℕ) : ℚ :=
            (t : ℚ) * ((t : ℚ) - 1) * ((t : ℚ) - 3) * ((t : ℚ) - 4) / 1120
          theorem P_falling_factorial_expansion (t : AgreementCount) :
              P t.1 = (1 / 280 : ℚ) * Nat.choose t.1 2
                - (3 / 280 : ℚ) * Nat.choose t.1 3
                + (3 / 140 : ℚ) * Nat.choose t.1 4 := by
            fin_cases t <;> norm_num [P, Nat.choose]
          theorem indicator_eight_le_P (t : AgreementCount) :
              (if t.1 = 8 then (1 : ℚ) else 0) ≤ P t.1 := by
            fin_cases t <;> norm_num [P]
          structure FourthMomentData (q : AgreementCount → ℚ) : Prop where
            nonneg : ∀ t, 0 ≤ q t
            moment2 : ∑ t : AgreementCount, q t * Nat.choose t.1 2 = 7 / 4
            moment3 : ∑ t : AgreementCount, q t * Nat.choose t.1 3 = 7 / 8
            moment4 : ∑ t : AgreementCount, q t * Nat.choose t.1 4 = 35 / 128
          theorem finite_nine_sum_linear_certificate
              (q f g h : AgreementCount → ℚ) (a b c : ℚ) :
              (∑ t : AgreementCount, q t * (a * f t - b * g t + c * h t)) =
                a * (∑ t : AgreementCount, q t * f t)
                - b * (∑ t : AgreementCount, q t * g t)
                + c * (∑ t : AgreementCount, q t * h t) := by
            simp [Fin.sum_univ_succ]
            ring
          theorem expected_P_eq_seven_over_2560
              {q : AgreementCount → ℚ} (D : FourthMomentData q) :
              ∑ t : AgreementCount, q t * P t.1 = 7 / 2560 := by
            calc
              (∑ t : AgreementCount, q t * P t.1) =
                  ∑ t : AgreementCount, q t *
                    ((1 / 280 : ℚ) * Nat.choose t.1 2
                    - (3 / 280 : ℚ) * Nat.choose t.1 3
                    + (3 / 140 : ℚ) * Nat.choose t.1 4) := by
                      apply Finset.sum_congr rfl
                      intro t ht
                      rw [P_falling_factorial_expansion]
              _ = (1 / 280 : ℚ) * (∑ t : AgreementCount, q t * Nat.choose t.1 2)
                  - (3 / 280 : ℚ) * (∑ t : AgreementCount, q t * Nat.choose t.1 3)
                  + (3 / 140 : ℚ) * (∑ t : AgreementCount, q t * Nat.choose t.1 4) := by
                      exact finite_nine_sum_linear_certificate q
                        (fun t => Nat.choose t.1 2)
                        (fun t => Nat.choose t.1 3)
                        (fun t => Nat.choose t.1 4)
                        (1 / 280) (3 / 280) (3 / 140)
              _ = 7 / 2560 := by
                    rw [D.moment2, D.moment3, D.moment4]
                    norm_num
          theorem atom_eight_le_seven_over_2560
              {q : AgreementCount → ℚ} (D : FourthMomentData q) :
              q ⟨8, by norm_num⟩ ≤ 7 / 2560 := by
            calc
              q ⟨8, by norm_num⟩ =
                  ∑ t : AgreementCount, q t * (if t.1 = 8 then (1 : ℚ) else 0) := by
                    simp [Fin.sum_univ_succ]
              _ ≤ ∑ t : AgreementCount, q t * P t.1 := by
                    apply Finset.sum_le_sum
                    intro t ht
                    exact mul_le_mul_of_nonneg_left (indicator_eight_le_P t) (D.nonneg t)
              _ = 7 / 2560 := expected_P_eq_seven_over_2560 D
          end AME84Support512
          EOF
          cat > AME84Support512/FiberCounting.lean <<'EOF'
          import Mathlib
          open scoped BigOperators
          namespace AME84Support512
          variable {Ω : Type} [Fintype Ω] [DecidableEq Ω]
          def probabilitySupport (p : Ω → ℚ) : Finset Ω :=
            Finset.univ.filter fun x => p x ≠ 0
          def indexedFiber (f : Ω → Fin 256) (a : Fin 256) : Finset Ω :=
            Finset.univ.filter fun x => f x = a
          def indexedSupportFiber (p : Ω → ℚ) (f : Ω → Fin 256) (a : Fin 256) : Finset Ω :=
            (indexedFiber f a).filter fun x => p x ≠ 0
          theorem sum_support_fiber_eq_full
              (p : Ω → ℚ) (f : Ω → Fin 256) (a : Fin 256) :
              ∑ x in indexedSupportFiber p f a, p x = ∑ x in indexedFiber f a, p x := by
            classical
            unfold indexedSupportFiber
            rw [Finset.sum_filter]
            apply Finset.sum_congr rfl
            intro x hx
            by_cases hp : p x = 0 <;> simp [hp]
          theorem support_partition
              (p : Ω → ℚ) (f : Ω → Fin 256) :
              (probabilitySupport p).card =
                ∑ a : Fin 256, (indexedSupportFiber p f a).card := by
            classical
            calc
              (probabilitySupport p).card = ∑ x in probabilitySupport p, 1 := by simp
              _ = ∑ x in probabilitySupport p,
                    ∑ a : Fin 256, if f x = a then 1 else 0 := by
                      apply Finset.sum_congr rfl
                      intro x hx
                      simp
              _ = ∑ a : Fin 256,
                    ∑ x in probabilitySupport p, if f x = a then 1 else 0 := by
                      rw [Finset.sum_comm]
              _ = ∑ a : Fin 256, (indexedSupportFiber p f a).card := by
                      apply Finset.sum_congr rfl
                      intro a ha
                      simp [indexedSupportFiber, indexedFiber, probabilitySupport]
          structure UniformIndexedFibers (p : Ω → ℚ) (f : Ω → Fin 256) : Prop where
            nonneg : ∀ x, 0 ≤ p x
            fiberMass : ∀ a, ∑ x in indexedFiber f a, p x = 1 / 256
            atomBound : ∀ x, p x ≤ 7 / 2560
          theorem each_indexed_fiber_has_two
              {p : Ω → ℚ} {f : Ω → Fin 256} (D : UniformIndexedFibers p f) (a : Fin 256) :
              2 ≤ (indexedSupportFiber p f a).card := by
            classical
            have hmass : ∑ x in indexedSupportFiber p f a, p x = 1 / 256 := by
              rw [sum_support_fiber_eq_full, D.fiberMass]
            by_contra hnot
            have hcases : (indexedSupportFiber p f a).card = 0 ∨
                (indexedSupportFiber p f a).card = 1 := by omega
            rcases hcases with hzero | hone
            · have hs : indexedSupportFiber p f a = ∅ := Finset.card_eq_zero.mp hzero
              rw [hs] at hmass
              norm_num at hmass
            · obtain ⟨x, hx⟩ := Finset.card_eq_one.mp hone
              rw [hx] at hmass
              simp only [Finset.sum_singleton] at hmass
              have hatom := D.atomBound x
              linarith
          theorem support_at_least_512
              {p : Ω → ℚ} {f : Ω → Fin 256} (D : UniformIndexedFibers p f) :
              512 ≤ (probabilitySupport p).card := by
            classical
            have hsum : (∑ a : Fin 256, 2) ≤
                ∑ a : Fin 256, (indexedSupportFiber p f a).card := by
              apply Finset.sum_le_sum
              intro a ha
              exact each_indexed_fiber_has_two D a
            calc
              512 = ∑ a : Fin 256, 2 := by norm_num
              _ ≤ ∑ a : Fin 256, (indexedSupportFiber p f a).card := hsum
              _ = (probabilitySupport p).card := (support_partition p f).symm
          theorem support_512_forces_index_two
              {p : Ω → ℚ} {f : Ω → Fin 256} (D : UniformIndexedFibers p f)
              (hsupport : (probabilitySupport p).card = 512) (a : Fin 256) :
              (indexedSupportFiber p f a).card = 2 := by
            classical
            have hge := each_indexed_fiber_has_two D a
            by_contra hne
            have hgt : 2 < (indexedSupportFiber p f a).card := by omega
            have hstrict : (∑ b : Fin 256, 2) <
                ∑ b : Fin 256, (indexedSupportFiber p f b).card := by
              apply Finset.sum_lt_sum
              · intro b hb
                exact each_indexed_fiber_has_two D b
              · exact ⟨a, Finset.mem_univ a, hgt⟩
            have hpartition := support_partition p f
            have hconstant : (∑ b : Fin 256, 2) = 512 := by norm_num
            rw [hconstant, ← hpartition, hsupport] at hstrict
            exact (lt_irrefl 512 hstrict)
          end AME84Support512
          EOF
          cat > AME84Support512/NegativeControls.lean <<'EOF'
          import AME84Support512.MomentCertificate
          open scoped BigOperators
          namespace AME84Support512
          def thirdOrderWitness (t : AgreementCount) : ℚ :=
            match t.1 with
            | 0 => 13 / 64
            | 2 => 7 / 16
            | 3 => 7 / 20
            | 8 => 3 / 320
            | _ => 0
          theorem thirdOrderWitness_nonnegative (t : AgreementCount) :
              0 ≤ thirdOrderWitness t := by
            fin_cases t <;> norm_num [thirdOrderWitness]
          theorem thirdOrderWitness_normalized :
              ∑ t : AgreementCount, thirdOrderWitness t = 1 := by
            norm_num [thirdOrderWitness, Fin.sum_univ_succ]
          theorem thirdOrderWitness_moment_one :
              ∑ t : AgreementCount, thirdOrderWitness t * Nat.choose t.1 1 = 2 := by
            norm_num [thirdOrderWitness, Fin.sum_univ_succ, Nat.choose]
          theorem thirdOrderWitness_moment_two :
              ∑ t : AgreementCount, thirdOrderWitness t * Nat.choose t.1 2 = 7 / 4 := by
            norm_num [thirdOrderWitness, Fin.sum_univ_succ, Nat.choose]
          theorem thirdOrderWitness_moment_three :
              ∑ t : AgreementCount, thirdOrderWitness t * Nat.choose t.1 3 = 7 / 8 := by
            norm_num [thirdOrderWitness, Fin.sum_univ_succ, Nat.choose]
          theorem third_order_does_not_force_atom_bound :
              ¬ (thirdOrderWitness ⟨8, by norm_num⟩ ≤ 7 / 2560) := by
            norm_num [thirdOrderWitness]
          theorem polynomial_sign_mutation_fails :
              (1 / 280 : ℚ) * (7 / 4) + (3 / 280) * (7 / 8) +
                (3 / 140) * (35 / 128) ≠ 7 / 2560 := by norm_num
          theorem fiber_size_mutation_fails : 256 * 1 ≠ 512 := by norm_num
          end AME84Support512
          EOF
          cat > AME84Support512.lean <<'EOF'
          import AME84Support512.Baseline
          import AME84Support512.MomentCertificate
          import AME84Support512.FiberCounting
          import AME84Support512.NegativeControls
          EOF
          rm -rf .lake/build
          if lake build > build_logs/tier1_build.log 2>&1; then
            echo 1 > /tmp/ame84-selected-tier
            rm -rf /tmp/ame84-tier1
            cp -a . /tmp/ame84-tier1
          else
            cp build_logs/tier1_build.log /tmp/tier1_failed_build.log
            cd ..
            rm -rf ame84-lean
            cp -a /tmp/ame84-tier0 ame84-lean
          fi
      - name: Attempt tier 2 orthogonality and local K2,2 theorem
        shell: bash
        run: |
          set -uo pipefail
          if [ "$(cat /tmp/ame84-selected-tier)" != "1" ]; then exit 0; fi
          cd ame84-lean
          cat > AME84Support512/GraphCore.lean <<'EOF'
          import Mathlib
          open scoped BigOperators
          namespace AME84Support512
          variable {R C : Type} [Fintype R] [DecidableEq R] [Fintype C] [DecidableEq C]
          def rowSupport (M : R → C → ℂ) (r : R) : Finset C :=
            Finset.univ.filter fun c => M r c ≠ 0
          def colSupport (M : R → C → ℂ) (c : C) : Finset R :=
            Finset.univ.filter fun r => M r c ≠ 0
          def commonSupport (M : R → C → ℂ) (r s : R) : Finset C :=
            Finset.univ.filter fun c => M r c ≠ 0 ∧ M s c ≠ 0
          def RowsOrthogonal (M : R → C → ℂ) : Prop :=
            ∀ r s, r ≠ s → ∑ c : C, M r c * star (M s c) = 0
          theorem sum_ne_zero_of_unique_nonzero
              (v : C → ℂ) (c : C) (hc : v c ≠ 0)
              (hother : ∀ d, d ≠ c → v d = 0) :
              ∑ d : C, v d ≠ 0 := by
            classical
            have hsum : (∑ d : C, v d) = v c := by
              apply Finset.sum_eq_single c
              · intro d hd hdc
                exact hother d hdc
              · simp
            rw [hsum]
            exact hc
          theorem unique_common_nonzero_forbids_orthogonality
              (M : R → C → ℂ) (r s : R) (c : C)
              (hunique : ∀ d, (M r d ≠ 0 ∧ M s d ≠ 0) ↔ d = c) :
              ∑ d : C, M r d * star (M s d) ≠ 0 := by
            apply sum_ne_zero_of_unique_nonzero
            · have hc := (hunique c).2 rfl
              exact mul_ne_zero hc.1 (by simpa using hc.2)
            · intro d hdc
              by_cases hr : M r d = 0
              · simp [hr]
              · have hs : M s d = 0 := by
                  by_contra hs
                  have : d = c := (hunique d).1 ⟨hr, hs⟩
                  exact hdc this
                simp [hs]
          theorem orthogonal_rows_have_no_single_common_support
              (M : R → C → ℂ) (horth : RowsOrthogonal M)
              (r s : R) (hrs : r ≠ s) :
              (commonSupport M r s).card ≠ 1 := by
            intro hcard
            obtain ⟨c, hset⟩ := Finset.card_eq_one.mp hcard
            have hunique : ∀ d, (M r d ≠ 0 ∧ M s d ≠ 0) ↔ d = c := by
              intro d
              have hm : d ∈ commonSupport M r s ↔ d = c := by
                rw [hset]
                simp
              simpa [commonSupport] using hm
            exact (unique_common_nonzero_forbids_orthogonality M r s c hunique)
              (horth r s hrs)
          theorem pair_eq_of_card_two_of_mem
              {α : Type} [DecidableEq α] (s : Finset α) (a b : α)
              (hab : a ≠ b) (ha : a ∈ s) (hb : b ∈ s) (hcard : s.card = 2) :
              s = {a, b} := by
            symm
            apply Finset.eq_of_subset_of_card_le
            · intro x hx
              simp only [Finset.mem_insert, Finset.mem_singleton] at hx
              rcases hx with rfl | rfl
              · exact ha
              · exact hb
            · simp [hcard, hab]
          theorem exists_other_of_card_two
              {α : Type} [DecidableEq α] (s : Finset α) (a : α)
              (ha : a ∈ s) (hcard : s.card = 2) :
              ∃ b, b ≠ a ∧ b ∈ s := by
            obtain ⟨u, v, huv, hset⟩ := Finset.card_eq_two.mp hcard
            have ha' : a = u ∨ a = v := by
              rw [hset] at ha
              simpa [eq_comm] using ha
            rcases ha' with rfl | rfl
            · exact ⟨v, huv.symm, by rw [hset]; simp⟩
            · exact ⟨u, huv, by rw [hset]; simp⟩
          theorem degree_two_orthogonal_support_is_locally_K22
              (M : R → C → ℂ) (horth : RowsOrthogonal M)
              (hrow : ∀ r, (rowSupport M r).card = 2)
              (hcol : ∀ c, (colSupport M c).card = 2)
              (r : R) :
              ∃ s c₁ c₂,
                s ≠ r ∧ c₁ ≠ c₂ ∧
                rowSupport M r = {c₁, c₂} ∧
                rowSupport M s = {c₁, c₂} ∧
                colSupport M c₁ = {r, s} ∧
                colSupport M c₂ = {r, s} := by
            classical
            obtain ⟨c₁, c₂, hcne, hrpair⟩ := Finset.card_eq_two.mp (hrow r)
            have hrc₁ : M r c₁ ≠ 0 := by
              have : c₁ ∈ rowSupport M r := by rw [hrpair]; simp
              simpa [rowSupport] using this
            have hrc₂ : M r c₂ ≠ 0 := by
              have : c₂ ∈ rowSupport M r := by rw [hrpair]; simp
              simpa [rowSupport] using this
            have hrincol₁ : r ∈ colSupport M c₁ := by simp [colSupport, hrc₁]
            obtain ⟨s, hsr, hscol₁⟩ := exists_other_of_card_two
              (colSupport M c₁) r hrincol₁ (hcol c₁)
            have hsc₁ : M s c₁ ≠ 0 := by simpa [colSupport] using hscol₁
            have hsc₂ : M s c₂ ≠ 0 := by
              by_contra hsnot
              have hinter : commonSupport M r s = {c₁} := by
                ext c
                constructor
                · intro hc
                  have hcdata : M r c ≠ 0 ∧ M s c ≠ 0 := by
                    simpa [commonSupport] using hc
                  have hcrow : c ∈ rowSupport M r := by simp [rowSupport, hcdata.1]
                  rw [hrpair] at hcrow
                  simp only [Finset.mem_insert, Finset.mem_singleton] at hcrow
                  rcases hcrow with hcc₁ | hcc₂
                  · simpa [hcc₁]
                  · subst c
                    exact (hsnot hcdata.2).elim
                · intro hc
                  have hcc₁ : c = c₁ := by simpa using hc
                  subst c
                  simp [commonSupport, hrc₁, hsc₁]
              have hone : (commonSupport M r s).card = 1 := by rw [hinter]; simp
              exact (orthogonal_rows_have_no_single_common_support M horth r s hsr.symm) hone
            have hspair : rowSupport M s = {c₁, c₂} := by
              apply pair_eq_of_card_two_of_mem (rowSupport M s) c₁ c₂ hcne
              · simp [rowSupport, hsc₁]
              · simp [rowSupport, hsc₂]
              · exact hrow s
            have hc₁pair : colSupport M c₁ = {r, s} := by
              apply pair_eq_of_card_two_of_mem (colSupport M c₁) r s hsr.symm
              · exact hrincol₁
              · exact hscol₁
              · exact hcol c₁
            have hc₂pair : colSupport M c₂ = {r, s} := by
              apply pair_eq_of_card_two_of_mem (colSupport M c₂) r s hsr.symm
              · simp [colSupport, hrc₂]
              · simp [colSupport, hsc₂]
              · exact hcol c₂
            exact ⟨s, c₁, c₂, hsr, hcne, hrpair, hspair, hc₁pair, hc₂pair⟩
          theorem four_edges_per_K22 : 2 * 2 = 4 := by norm_num
          theorem one_hundred_twenty_eight_blocks_count : 128 * 4 = 512 := by norm_num
          end AME84Support512
          EOF
          cat > AME84Support512.lean <<'EOF'
          import AME84Support512.Baseline
          import AME84Support512.MomentCertificate
          import AME84Support512.FiberCounting
          import AME84Support512.NegativeControls
          import AME84Support512.GraphCore
          EOF
          rm -rf .lake/build
          if lake build > build_logs/tier2_build.log 2>&1; then
            echo 2 > /tmp/ame84-selected-tier
          else
            cp build_logs/tier2_build.log /tmp/tier2_failed_build.log
            cd ..
            rm -rf ame84-lean
            cp -a /tmp/ame84-tier1 ame84-lean
          fi
      - name: Finalize selected tier documentation and run clean build
        shell: bash
        run: |
          set -euo pipefail
          tier=$(cat /tmp/ame84-selected-tier)
          cd ame84-lean
          cp /tmp/tier1_failed_build.log build_logs/ 2>/dev/null || true
          cp /tmp/tier2_failed_build.log build_logs/ 2>/dev/null || true
          cat > README.md <<EOF
          # AME(8,4) support-512 Lean package

          Selected compiler-clean tier: **${tier}**.

          Pinned toolchain: \`leanprover/lean4:v4.32.1\`.
          Pinned Mathlib commit: \`520045ab14e26149ee970e2e617ca04b09bde5d6\`.

          The package does not claim unrestricted AME(8,4) existence or nonexistence. See \`FORMALIZATION_MANIFEST.md\` for the exact proof boundary.

          Build with \`lake exe cache get && lake build\`.
          EOF
          if [ "$tier" = 2 ]; then
            cat > FORMALIZATION_MANIFEST.md <<'EOF'
          # Formalization manifest — selected tier 2

          ## Kernel-proved
          - exact polynomial arithmetic and finite counts;
          - exact fourth-moment expectation and atom certificate from `FourthMomentData`;
          - abstract 256-fiber support lower bound and equality saturation;
          - single-common-support exclusion from complex row orthogonality;
          - degree-two row/column support implies a local `K_2,2` block around every row;
          - exact classification-hypothesis boundary and Singleton arithmetic;
          - moment-order, coefficient, fiber-size, degree, cycle, and code-parameter mutations.

          ## Conditional
          `conditional_additive_code_exclusion` takes `KurzNThreePointFiveSThreeEqSeven` as a theorem hypothesis. It is not an axiom.

          ## Not formalized
          The concrete AME marginal-to-moment bridge, the global quotient count of exactly 128 disjoint blocks, the 2x2 matrix normal-form parametrization, and the binary-affine-to-code construction remain unformalized. No theorem claims them.
          EOF
          else
            cat > FORMALIZATION_MANIFEST.md <<EOF
          # Formalization manifest — selected tier ${tier}

          The higher-tier build logs are included. Only declarations imported by \`AME84Support512.lean\` in this selected tier are kernel-proved.

          Tier 0 proves exact polynomial/count arithmetic, the classification hypothesis interface, and Singleton arithmetic.
          Tier 1 additionally proves the abstract fourth-moment atom certificate and 256-fiber support/equality counting if selected.

          The concrete AME marginal bridge, graph/block decomposition, 2x2 unitary normal form, and binary-affine reduction are not claimed unless present in the selected root imports.
          EOF
          fi
          cat > THEOREM_MAP.md <<EOF
          # Theorem map

          Selected tier: ${tier}.

          Baseline: \`certificatePolynomial_table\`, \`certificate_expectation_arithmetic\`, \`finite_counts\`, \`singleton_forces_distance_five\`, \`conditional_additive_code_exclusion\`.

          Tier 1 when selected: \`P_falling_factorial_expansion\`, \`expected_P_eq_seven_over_2560\`, \`atom_eight_le_seven_over_2560\`, \`support_at_least_512\`, \`support_512_forces_index_two\`, negative controls.

          Tier 2 when selected: \`orthogonal_rows_have_no_single_common_support\`, \`degree_two_orthogonal_support_is_locally_K22\`.
          EOF
          cat > AXIOM_REPORT.md <<'EOF'
          # Axiom report

          The package declares no custom axiom. `KurzNThreePointFiveSThreeEqSeven` is a definition of a proposition and is accepted only as an explicit hypothesis of the conditional corollary. `build_logs/axiom_report_output.log` is the captured `#print axioms` output for the selected headline theorems.
          EOF
          cat > AME84Support512/AxiomReport.lean <<'EOF'
          import AME84Support512
          open AME84Support512
          #print axioms certificatePolynomial_table
          #print axioms certificate_expectation_arithmetic
          #print axioms finite_counts
          #print axioms singleton_forces_distance_five
          #print axioms conditional_additive_code_exclusion
          EOF
          if [ "$tier" -ge 1 ]; then
            cat >> AME84Support512/AxiomReport.lean <<'EOF'
          #print axioms P_falling_factorial_expansion
          #print axioms expected_P_eq_seven_over_2560
          #print axioms atom_eight_le_seven_over_2560
          #print axioms support_at_least_512
          #print axioms support_512_forces_index_two
          #print axioms third_order_does_not_force_atom_bound
          EOF
          fi
          if [ "$tier" -ge 2 ]; then
            cat >> AME84Support512/AxiomReport.lean <<'EOF'
          #print axioms orthogonal_rows_have_no_single_common_support
          #print axioms degree_two_orthogonal_support_is_locally_K22
          EOF
          fi
          rm -rf .lake/build
          lake build 2>&1 | tee build_logs/clean_lake_build.log
          {
            echo
            echo '--- environment attestation ---'
            lean --version
            lake --version
            printf 'mathlib_commit='
            git -C .lake/packages/mathlib rev-parse HEAD
            echo "selected_tier=${tier}"
            echo 'lake_build_exit_status=0'
          } | tee -a build_logs/clean_lake_build.log
          lake env lean AME84Support512/AxiomReport.lean 2>&1 | tee build_logs/axiom_report_output.log
          python3 scripts/check_no_placeholders.py
      - name: Package selected compiler-clean project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ame84-final
          mkdir -p ame84-final
          find ame84-lean -type f -not -path 'ame84-lean/.lake/*' -print0 | sort -z | xargs -0 sha256sum > ame84-lean/MANIFEST.sha256
          (cd ame84-lean && zip -qr ../ame84-final/AME84_support512_Lean_FINAL.zip . -x '.lake/*')
          sha256sum ame84-final/AME84_support512_Lean_FINAL.zip > ame84-final/AME84_support512_Lean_FINAL.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AME84-support512-Lean-FINAL
          path: ame84-final
          retention-days: 30
      - name: Commit successful final archive to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AME84 Lean CI'
          git config user.email 'actions@users.noreply.github.com'
          mkdir -p ame84-deliverables
          cp ame84-final/AME84_support512_Lean_FINAL.zip ame84-deliverables/
          cp ame84-final/AME84_support512_Lean_FINAL.zip.sha256 ame84-deliverables/
          git add -f ame84-deliverables/AME84_support512_Lean_FINAL.zip ame84-deliverables/AME84_support512_Lean_FINAL.zip.sha256
          git commit -m 'Attach tier-selected compiler-clean AME84 Lean package' || exit 0
          git push origin HEAD:ame84-support512-lean-build
