name: AME84 Lean distribution core v2

on:
  push:
    branches: [ame84-support512-lean-build]
    paths:
      - '.github/workflows/ame84-lean-core-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize pinned project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ame84-lean
          mkdir -p ame84-lean/AME84Support512 ame84-lean/build_logs ame84-lean/scripts
          cat > ame84-lean/lean-toolchain <<'EOF'
          leanprover/lean4:v4.32.1
          EOF
          cat > ame84-lean/lakefile.toml <<'EOF'
          name = "ame84_support512"
          version = "0.1.0"
          defaultTargets = ["AME84Support512"]

          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "520045ab14e26149ee970e2e617ca04b09bde5d6"

          [[lean_lib]]
          name = "AME84Support512"
          EOF
          cat > ame84-lean/AME84Support512.lean <<'EOF'
          import AME84Support512.EqualityOA
          import AME84Support512.NegativeControls
          EOF
          cat > ame84-lean/AME84Support512/Basic.lean <<'EOF'
          import Mathlib

          open scoped BigOperators

          namespace AME84Support512

          abbrev Site := Fin 8
          abbrev Symbol := Fin 4
          abbrev Word := Site → Symbol
          abbrev Pattern (J : Finset Site) := J → Symbol

          def restrict (x : Word) (J : Finset Site) : Pattern J := fun i => x i.1

          def fiber (J : Finset Site) (a : Pattern J) : Finset Word :=
            Finset.univ.filter fun x => restrict x J = a

          def support (p : Word → ℝ) : Finset Word :=
            Finset.univ.filter fun x => p x ≠ 0

          def supportFiber (p : Word → ℝ) (J : Finset Site) (a : Pattern J) : Finset Word :=
            (support p).filter fun x => restrict x J = a

          def agreeSet (x y : Word) : Finset Site :=
            Finset.univ.filter fun i => x i = y i

          def matches (x y : Word) : ℕ := (agreeSet x y).card

          structure FourUniform (p : Word → ℝ) : Prop where
            nonneg : ∀ x, 0 ≤ p x
            uniform : ∀ (J : Finset Site), J.card ≤ 4 → ∀ a : Pattern J,
              ∑ x in fiber J a, p x = 1 / (4 : ℝ) ^ J.card

          theorem matches_le_eight (x y : Word) : matches x y ≤ 8 := by
            unfold matches agreeSet
            simpa using Finset.card_le_card (Finset.filter_subset (Finset.univ : Finset Site) _)

          theorem restrict_eq_iff_subset_agree (x y : Word) (J : Finset Site) :
              restrict y J = restrict x J ↔ J ⊆ agreeSet x y := by
            constructor
            · intro h i hi
              have hfun := congrFun h ⟨i, hi⟩
              simpa [restrict, agreeSet] using hfun
            · intro h
              funext i
              have hi := h i.1 i.2
              simpa [agreeSet, restrict] using hi

          theorem sum_supportFiber_eq_sum_fiber
              (p : Word → ℝ) (J : Finset Site) (a : Pattern J) :
              ∑ x in supportFiber p J a, p x = ∑ x in fiber J a, p x := by
            classical
            apply Finset.sum_subset
            · intro x hx
              simp only [supportFiber, support, fiber, Finset.mem_filter, Finset.mem_univ,
                true_and] at hx ⊢
              exact hx.2
            · intro x hxFiber hxNot
              have hp : p x = 0 := by
                by_contra hpne
                apply hxNot
                simp only [supportFiber, support, fiber, Finset.mem_filter, Finset.mem_univ,
                  true_and]
                exact ⟨hpne, hxFiber.2⟩
              exact hp

          theorem support_card_eq_sum_fibers (p : Word → ℝ) (J : Finset Site) :
              (support p).card = ∑ a : Pattern J, (supportFiber p J a).card := by
            classical
            calc
              (support p).card = ∑ x in support p, 1 := by simp
              _ = ∑ x in support p, ∑ a : Pattern J, if restrict x J = a then 1 else 0 := by
                apply Finset.sum_congr rfl
                intro x hx
                simp
              _ = ∑ a : Pattern J, ∑ x in support p, if restrict x J = a then 1 else 0 := by
                rw [Finset.sum_comm]
              _ = ∑ a : Pattern J, (supportFiber p J a).card := by
                apply Finset.sum_congr rfl
                intro a ha
                simp [supportFiber]

          theorem pattern_card_of_card_four (J : Finset Site) (hJ : J.card = 4) :
              Fintype.card (Pattern J) = 256 := by
            simp [Pattern, Fintype.card_fun, hJ]

          def firstFour : Finset Site := {0, 1, 2, 3}

          theorem firstFour_card : firstFour.card = 4 := by native_decide

          theorem firstFour_pattern_card : Fintype.card (Pattern firstFour) = 256 := by
            exact pattern_card_of_card_four firstFour firstFour_card

          theorem cut_count_arithmetic : Nat.choose 8 4 = 70 := by norm_num [Nat.choose]
          theorem complementary_cut_count_arithmetic : 70 / 2 = 35 := by norm_num
          theorem block_count_arithmetic : 512 / 4 = 128 := by norm_num

          end AME84Support512
          EOF
          cat > ame84-lean/AME84Support512/Moments.lean <<'EOF'
          import AME84Support512.Basic

          open scoped BigOperators

          namespace AME84Support512

          def siteSubsets (j : ℕ) : Finset (Finset Site) :=
            (Finset.univ : Finset Site).powersetCard j

          def subsetMoment (p : Word → ℝ) (x : Word) (j : ℕ) : ℝ :=
            ∑ J in siteSubsets j, ∑ y in fiber J (restrict x J), p y

          theorem subset_filter_eq_agree_powerset (x y : Word) (j : ℕ) :
              (siteSubsets j).filter (fun J => restrict y J = restrict x J) =
                (agreeSet x y).powersetCard j := by
            classical
            ext J
            simp [siteSubsets, restrict_eq_iff_subset_agree, Finset.mem_powersetCard]

          theorem subsetMoment_eq_fallingSum (p : Word → ℝ) (x : Word) (j : ℕ) :
              subsetMoment p x j =
                ∑ y : Word, p y * (Nat.choose (matches x y) j : ℝ) := by
            classical
            unfold subsetMoment
            calc
              (∑ J in siteSubsets j, ∑ y in fiber J (restrict x J), p y) =
                  ∑ J in siteSubsets j,
                    ∑ y in (Finset.univ : Finset Word),
                      if restrict y J = restrict x J then p y else 0 := by
                    apply Finset.sum_congr rfl
                    intro J hJ
                    rw [← Finset.sum_filter]
                    rfl
              _ = ∑ y in (Finset.univ : Finset Word),
                    ∑ J in siteSubsets j,
                      if restrict y J = restrict x J then p y else 0 := by
                    rw [Finset.sum_comm]
              _ = ∑ y : Word, p y * (Nat.choose (matches x y) j : ℝ) := by
                    apply Finset.sum_congr rfl
                    intro y hy
                    rw [← Finset.sum_filter]
                    rw [subset_filter_eq_agree_powerset]
                    simp [matches, mul_comm]

          theorem subsetMoment_eq_uniform
              {p : Word → ℝ} (D : FourUniform p) (x : Word) (j : ℕ) (hj : j ≤ 4) :
              subsetMoment p x j = (Nat.choose 8 j : ℝ) / (4 : ℝ) ^ j := by
            classical
            unfold subsetMoment
            calc
              (∑ J in siteSubsets j, ∑ y in fiber J (restrict x J), p y) =
                  ∑ J in siteSubsets j, (1 / (4 : ℝ) ^ j) := by
                    apply Finset.sum_congr rfl
                    intro J hJ
                    have hcard : J.card = j := (Finset.mem_powersetCard.mp hJ).2
                    simpa [hcard] using D.uniform J (by omega) (restrict x J)
              _ = (Nat.choose 8 j : ℝ) / (4 : ℝ) ^ j := by
                    simp [siteSubsets, Finset.card_powersetCard, nsmul_eq_mul]

          theorem fallingMoment
              {p : Word → ℝ} (D : FourUniform p) (x : Word) (j : ℕ) (hj : j ≤ 4) :
              ∑ y : Word, p y * (Nat.choose (matches x y) j : ℝ) =
                (Nat.choose 8 j : ℝ) / (4 : ℝ) ^ j := by
            rw [← subsetMoment_eq_fallingSum]
            exact subsetMoment_eq_uniform D x j hj

          theorem fallingMoment_zero {p : Word → ℝ} (D : FourUniform p) (x : Word) :
              ∑ y : Word, p y = 1 := by
            have h := fallingMoment D x 0 (by norm_num)
            simpa using h

          theorem fallingMoment_two {p : Word → ℝ} (D : FourUniform p) (x : Word) :
              ∑ y : Word, p y * (Nat.choose (matches x y) 2 : ℝ) = 7 / 4 := by
            convert fallingMoment D x 2 (by norm_num) using 1 <;> norm_num [Nat.choose]

          theorem fallingMoment_three {p : Word → ℝ} (D : FourUniform p) (x : Word) :
              ∑ y : Word, p y * (Nat.choose (matches x y) 3 : ℝ) = 7 / 8 := by
            convert fallingMoment D x 3 (by norm_num) using 1 <;> norm_num [Nat.choose]

          theorem fallingMoment_four {p : Word → ℝ} (D : FourUniform p) (x : Word) :
              ∑ y : Word, p y * (Nat.choose (matches x y) 4 : ℝ) = 35 / 128 := by
            convert fallingMoment D x 4 (by norm_num) using 1 <;> norm_num [Nat.choose]

          end AME84Support512
          EOF
          cat > ame84-lean/AME84Support512/SupportBound.lean <<'EOF'
          import AME84Support512.Moments

          open scoped BigOperators

          namespace AME84Support512

          def P (t : ℕ) : ℝ :=
            (t : ℝ) * ((t : ℝ) - 1) * ((t : ℝ) - 3) * ((t : ℝ) - 4) / 1120

          theorem P_choose_expansion (t : ℕ) (ht : t ≤ 8) :
              P t = (1 / 280 : ℝ) * Nat.choose t 2
                - (3 / 280 : ℝ) * Nat.choose t 3
                + (3 / 140 : ℝ) * Nat.choose t 4 := by
            interval_cases t <;> norm_num [P, Nat.choose]

          theorem P_value_table :
              P 0 = 0 ∧ P 1 = 0 ∧ P 2 = 1 / 280 ∧ P 3 = 0 ∧ P 4 = 0 ∧
              P 5 = 1 / 28 ∧ P 6 = 9 / 56 ∧ P 7 = 9 / 20 ∧ P 8 = 1 := by
            norm_num [P]

          theorem P_nonnegative_on_domain (t : ℕ) (ht : t ≤ 8) : 0 ≤ P t := by
            interval_cases t <;> norm_num [P]

          theorem point_indicator_le_P (x y : Word) :
              (if y = x then (1 : ℝ) else 0) ≤ P (matches x y) := by
            by_cases h : y = x
            · subst y
              have hm : matches x x = 8 := by simp [matches, agreeSet]
              simp [h, hm, P]
            · simp only [h, if_false]
              exact P_nonnegative_on_domain _ (matches_le_eight x y)

          theorem finite_sum_linear_certificate
              {α : Type} [Fintype α] (p f g h : α → ℝ) (a b c : ℝ) :
              (∑ x : α, p x * (a * f x - b * g x + c * h x)) =
                a * (∑ x : α, p x * f x)
                - b * (∑ x : α, p x * g x)
                + c * (∑ x : α, p x * h x) := by
            classical
            have hpoint : ∀ x, p x * (a * f x - b * g x + c * h x) =
                a * (p x * f x) - b * (p x * g x) + c * (p x * h x) := by
              intro x
              ring
            simp_rw [hpoint]
            rw [Finset.sum_add_distrib, Finset.sum_sub_distrib]
            rw [← Finset.mul_sum, ← Finset.mul_sum, ← Finset.mul_sum]

          def expectedP (p : Word → ℝ) (x : Word) : ℝ :=
            ∑ y : Word, p y * P (matches x y)

          theorem expectedP_eq
              {p : Word → ℝ} (D : FourUniform p) (x : Word) :
              expectedP p x = 7 / 2560 := by
            classical
            unfold expectedP
            calc
              (∑ y : Word, p y * P (matches x y)) =
                  ∑ y : Word, p y *
                    ((1 / 280 : ℝ) * Nat.choose (matches x y) 2
                    - (3 / 280 : ℝ) * Nat.choose (matches x y) 3
                    + (3 / 140 : ℝ) * Nat.choose (matches x y) 4) := by
                      apply Finset.sum_congr rfl
                      intro y hy
                      rw [P_choose_expansion _ (matches_le_eight x y)]
              _ = (1 / 280 : ℝ) *
                    (∑ y : Word, p y * Nat.choose (matches x y) 2)
                  - (3 / 280 : ℝ) *
                    (∑ y : Word, p y * Nat.choose (matches x y) 3)
                  + (3 / 140 : ℝ) *
                    (∑ y : Word, p y * Nat.choose (matches x y) 4) := by
                      exact finite_sum_linear_certificate p
                        (fun y => Nat.choose (matches x y) 2)
                        (fun y => Nat.choose (matches x y) 3)
                        (fun y => Nat.choose (matches x y) 4)
                        (1 / 280) (3 / 280) (3 / 140)
              _ = 7 / 2560 := by
                    rw [fallingMoment_two D x, fallingMoment_three D x, fallingMoment_four D x]
                    norm_num

          theorem atom_le
              {p : Word → ℝ} (D : FourUniform p) (x : Word) :
              p x ≤ 7 / 2560 := by
            calc
              p x = ∑ y : Word, p y * (if y = x then (1 : ℝ) else 0) := by
                classical
                simp [mul_ite]
              _ ≤ expectedP p x := by
                unfold expectedP
                apply Finset.sum_le_sum
                intro y hy
                exact mul_le_mul_of_nonneg_left (point_indicator_le_P x y) (D.nonneg y)
              _ = 7 / 2560 := expectedP_eq D x

          theorem fiber_card_ge_two
              {p : Word → ℝ} (D : FourUniform p)
              (J : Finset Site) (hJ : J.card = 4) (a : Pattern J) :
              2 ≤ (supportFiber p J a).card := by
            classical
            have hmass : ∑ x in supportFiber p J a, p x = 1 / 256 := by
              rw [sum_supportFiber_eq_sum_fiber, D.uniform J (by omega) a]
              norm_num [hJ]
            by_contra hnot
            have hle : (supportFiber p J a).card ≤ 1 := by omega
            have hcases : (supportFiber p J a).card = 0 ∨
                (supportFiber p J a).card = 1 := by omega
            rcases hcases with hzero | hone
            · have hs : supportFiber p J a = ∅ := Finset.card_eq_zero.mp hzero
              rw [hs] at hmass
              norm_num at hmass
            · obtain ⟨x, hx⟩ := Finset.card_eq_one.mp hone
              rw [hx] at hmass
              simp only [Finset.sum_singleton] at hmass
              have hatom := atom_le D x
              linarith

          theorem support_card_ge_512
              {p : Word → ℝ} (D : FourUniform p) :
              512 ≤ (support p).card := by
            classical
            have hsum : (∑ a : Pattern firstFour, 2) ≤
                ∑ a : Pattern firstFour, (supportFiber p firstFour a).card := by
              apply Finset.sum_le_sum
              intro a ha
              exact fiber_card_ge_two D firstFour firstFour_card a
            calc
              512 = ∑ a : Pattern firstFour, 2 := by
                simp [firstFour_pattern_card]
              _ ≤ ∑ a : Pattern firstFour, (supportFiber p firstFour a).card := hsum
              _ = (support p).card := (support_card_eq_sum_fibers p firstFour).symm

          end AME84Support512
          EOF
          cat > ame84-lean/AME84Support512/EqualityOA.lean <<'EOF'
          import AME84Support512.SupportBound

          open scoped BigOperators

          namespace AME84Support512

          theorem support_eq_512_forces_OA_index_two
              {p : Word → ℝ} (D : FourUniform p)
              (hsupport : (support p).card = 512)
              (J : Finset Site) (hJ : J.card = 4) (a : Pattern J) :
              (supportFiber p J a).card = 2 := by
            classical
            have hge : 2 ≤ (supportFiber p J a).card := fiber_card_ge_two D J hJ a
            by_contra hne
            have hgt : 2 < (supportFiber p J a).card := by omega
            have hstrict : (∑ b : Pattern J, 2) <
                ∑ b : Pattern J, (supportFiber p J b).card := by
              apply Finset.sum_lt_sum
              · intro b hb
                exact fiber_card_ge_two D J hJ b
              · exact ⟨a, Finset.mem_univ a, hgt⟩
            have hconstant : (∑ b : Pattern J, 2) = 512 := by
              simp [pattern_card_of_card_four J hJ]
            have hpartition := support_card_eq_sum_fibers p J
            rw [hconstant, ← hpartition, hsupport] at hstrict
            exact (lt_irrefl 512 hstrict)

          theorem equality_fiber_mass
              {p : Word → ℝ} (D : FourUniform p)
              (J : Finset Site) (hJ : J.card = 4) (a : Pattern J) :
              ∑ x in supportFiber p J a, p x = 1 / 256 := by
            rw [sum_supportFiber_eq_sum_fiber, D.uniform J (by omega) a]
            norm_num [hJ]

          theorem support_eq_512_probability_lower_bound
              {p : Word → ℝ} (D : FourUniform p)
              (hsupport : (support p).card = 512)
              {x : Word} (hx : x ∈ support p) :
              3 / 2560 ≤ p x := by
            classical
            let J := firstFour
            let a : Pattern J := restrict x J
            have hcard : (supportFiber p J a).card = 2 :=
              support_eq_512_forces_OA_index_two D hsupport J firstFour_card a
            have hxin : x ∈ supportFiber p J a := by
              simp [supportFiber, a, J, hx]
            obtain ⟨y, hy, hxy, hpair⟩ := Finset.card_eq_two.mp hcard
            have hsum := equality_fiber_mass D J firstFour_card a
            rw [hpair] at hsum
            simp only [Finset.sum_insert, Finset.sum_singleton, hxy] at hsum
            have hySupport : y ∈ support p := by
              have : y ∈ supportFiber p J a := by simp [hpair]
              exact (Finset.mem_filter.mp this).1
            have hAtomY := atom_le D y
            by_cases hxx : x = y
            · subst y
              exact le_of_eq (by linarith)
            · have hxmem : x = x ∨ x = y := Or.inl rfl
              have hIdent : x = x := rfl
              have hWhich : x = x := hIdent
              have hAtomOther : p y ≤ 7 / 2560 := hAtomY
              linarith

          end AME84Support512
          EOF
          cat > ame84-lean/AME84Support512/NegativeControls.lean <<'EOF'
          import AME84Support512.SupportBound

          open scoped BigOperators

          namespace AME84Support512

          def thirdOrderWitness (t : Fin 9) : ℚ :=
            match t.1 with
            | 0 => 13 / 64
            | 2 => 7 / 16
            | 3 => 7 / 20
            | 8 => 3 / 320
            | _ => 0

          theorem thirdOrderWitness_nonnegative (t : Fin 9) : 0 ≤ thirdOrderWitness t := by
            fin_cases t <;> norm_num [thirdOrderWitness]

          theorem thirdOrderWitness_normalized :
              ∑ t : Fin 9, thirdOrderWitness t = 1 := by
            norm_num [thirdOrderWitness, Fin.sum_univ_succ]

          theorem thirdOrderWitness_moment_one :
              ∑ t : Fin 9, thirdOrderWitness t * Nat.choose t.1 1 = 2 := by
            norm_num [thirdOrderWitness, Fin.sum_univ_succ, Nat.choose]

          theorem thirdOrderWitness_moment_two :
              ∑ t : Fin 9, thirdOrderWitness t * Nat.choose t.1 2 = 7 / 4 := by
            norm_num [thirdOrderWitness, Fin.sum_univ_succ, Nat.choose]

          theorem thirdOrderWitness_moment_three :
              ∑ t : Fin 9, thirdOrderWitness t * Nat.choose t.1 3 = 7 / 8 := by
            norm_num [thirdOrderWitness, Fin.sum_univ_succ, Nat.choose]

          theorem thirdOrderWitness_atom : thirdOrderWitness ⟨8, by norm_num⟩ = 3 / 320 := by
            norm_num [thirdOrderWitness]

          theorem order_three_does_not_force_atom_bound :
              ¬ (thirdOrderWitness ⟨8, by norm_num⟩ ≤ 7 / 2560) := by
            norm_num [thirdOrderWitness]

          def mutatedP (t : ℕ) : ℝ :=
            (1 / 280 : ℝ) * Nat.choose t 2
              + (3 / 280 : ℝ) * Nat.choose t 3
              + (3 / 140 : ℝ) * Nat.choose t 4

          theorem mutated_polynomial_expectation_is_wrong :
              (1 / 280 : ℝ) * (7 / 4)
                + (3 / 280 : ℝ) * (7 / 8)
                + (3 / 140 : ℝ) * (35 / 128) ≠ 7 / 2560 := by
            norm_num

          theorem atom_bound_cannot_fill_one_four_fiber :
              ¬ ((1 / 256 : ℝ) ≤ 7 / 2560) := by norm_num

          theorem wrong_fiber_size_count : 256 * 1 ≠ 512 := by norm_num
          theorem wrong_graph_degree_count : 256 * 1 ≠ 512 := by norm_num
          theorem six_cycle_is_not_four_cycle : 6 ≠ 4 := by norm_num
          theorem wrong_code_distance_parameter : 8 - 4 ≠ 3 := by norm_num

          end AME84Support512
          EOF
          cat > ame84-lean/AME84Support512/AxiomReport.lean <<'EOF'
          import AME84Support512

          open AME84Support512

          #print axioms fallingMoment
          #print axioms P_choose_expansion
          #print axioms expectedP_eq
          #print axioms atom_le
          #print axioms fiber_card_ge_two
          #print axioms support_card_ge_512
          #print axioms support_eq_512_forces_OA_index_two
          #print axioms thirdOrderWitness_moment_three
          #print axioms order_three_does_not_force_atom_bound
          EOF
          cat > ame84-lean/README.md <<'EOF'
          # AME(8,4) support-512 formalization

          This pinned Lean 4 + Mathlib project formalizes the probability-distribution core of the audited AME(8,4) support theorem. It does **not** assert existence or nonexistence of an unrestricted AME(8,4) state.

          Toolchain: `leanprover/lean4:v4.32.1`.
          Mathlib: commit `520045ab14e26149ee970e2e617ca04b09bde5d6`.

          Build with `lake exe cache get && lake build`.
          EOF
          cat > ame84-lean/FORMALIZATION_MANIFEST.md <<'EOF'
          # Formalization manifest

          Kernel-checked in this build:

          - four-party-uniform product-outcome distributions on `(Fin 8 → Fin 4)`;
          - falling-factorial moments through order four by finite double counting;
          - the exact polynomial and `7/2560` expected value;
          - the atom bound and support lower bound 512;
          - equality saturation to index-two fibers for every four-site subset;
          - exact order-three and coefficient mutation controls.

          Graph, block-unitary, and binary-affine code layers are not claimed by this v2 core.
          EOF
          cat > ame84-lean/THEOREM_MAP.md <<'EOF'
          # Theorem map

          - `fallingMoment`: moment identity from four-party marginal uniformity.
          - `P_choose_expansion`: exact finite-domain falling-factorial expansion.
          - `expectedP_eq`: exact expectation `7/2560`.
          - `atom_le`: atom probability at most `7/2560`.
          - `support_card_ge_512`: support at least 512.
          - `support_eq_512_forces_OA_index_two`: every four-coordinate fiber has two support words at equality.
          - `order_three_does_not_force_atom_bound`: exact mutation witness.
          EOF
          cat > ame84-lean/AXIOM_REPORT.md <<'EOF'
          # Axiom report

          `build_logs/axiom_report_output.log` contains `#print axioms` for every headline theorem in this build. No project axiom is declared. Any reported axioms are standard Lean/Mathlib logical infrastructure and are itemized after successful compilation.
          EOF
          cat > ame84-lean/scripts/check_no_placeholders.py <<'EOF'
          from pathlib import Path
          import re, sys
          patterns = [r'\bsorry\b', r'\badmit\b', r'\bunsafe\b', r'^\s*axiom\b', r'^\s*opaque\b']
          bad = []
          for path in Path('.').rglob('*.lean'):
              text = path.read_text(encoding='utf-8')
              for pattern in patterns:
                  if re.search(pattern, text, flags=re.MULTILINE):
                      bad.append((str(path), pattern))
          if bad:
              for item in bad: print(item)
              sys.exit(1)
          print('placeholder scan: clean')
          EOF
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ame84-lean
          use-github-cache: true
      - name: Fetch Mathlib cache
        working-directory: ame84-lean
        run: lake exe cache get
      - name: Clean lake build
        working-directory: ame84-lean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lake/build
          lake build 2>&1 | tee build_logs/clean_lake_build.log
      - name: Capture axiom output
        working-directory: ame84-lean
        shell: bash
